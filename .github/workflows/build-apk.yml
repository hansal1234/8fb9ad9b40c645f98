name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install NDK 29 (strips native libs of plugins)
        run: |
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="sdkmanager"
          else
            for dir in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "/usr/local/lib/android/sdk"; do
              if [ -n "$dir" ] && [ -f "$dir/cmdline-tools/latest/bin/sdkmanager" ]; then
                SDKMANAGER="$dir/cmdline-tools/latest/bin/sdkmanager"
                break
              fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "ndk;29.0.14033849"
          echo "NDK installed"

      - name: Create google-services.json
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Get dependencies
        run: flutter pub get

      - name: Patch pub-cache plugins (Gradle 9 / AGP 9 compat)
        shell: bash
        run: |
          SEARCH_DIRS="$HOME/.pub-cache $PUB_CACHE $RUNNER_TOOL_CACHE/flutter/.pub-cache"
          for d in $SEARCH_DIRS; do
            if [ -n "$d" ] && [ -d "$d" ] && [ -d "$d/hosted/pub.dev" ]; then
              # Gradle 9 removed the jcenter() repository method
              while IFS= read -r -d '' f; do
                echo "jcenter fix: $f"
                sed -i 's/jcenter()/mavenCentral()/g' "$f"
              done < <(grep -rlZ --include=build.gradle 'jcenter()' "$d/hosted/pub.dev" 2>/dev/null)
              # AGP 9 removed getDefaultProguardFile('proguard-android.txt')
              while IFS= read -r -d '' f; do
                echo "proguard fix: $f"
                sed -i "s/getDefaultProguardFile('proguard-android\.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$f"
              done < <(grep -rlZ --include=build.gradle "getDefaultProguardFile('proguard-android.txt')" "$d/hosted/pub.dev" 2>/dev/null)
              # Gradle 9 removed the no-arg 'all' on configuration containers
              while IFS= read -r -d '' f; do
                echo "configurations.all fix: $f"
                sed -i 's/for (def configuration : configurations\.all)/for (def configuration : configurations)/g' "$f"
              done < <(grep -rlZ --include=build.gradle 'for (def configuration : configurations.all)' "$d/hosted/pub.dev" 2>/dev/null)
            fi
          done

      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "release keystore configured"
          else
            echo "no release keystore secret; release builds will be debug-signed"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build release AAB (Play Store)
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab